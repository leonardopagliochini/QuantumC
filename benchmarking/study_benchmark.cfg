# Study benchmark config (TOML). Comments are ignored.

# Provide the study name on the CLI when invoking
# `python benchmarking/study_benchmark.py <study>`.

# Pipeline parameters
bits = 12                  # number of qubits requested from the pipeline
cc = "gcc"                 # Callgrind compiler (any cc that understands -O0 -g)
arch = "x86-64"            # optional -march flag; set to "" to skip
max_iter = 30              # maximum unrolling depth for pipeline lowerings
ir_roi_func = ""           # Callgrind --toggle-collect function (leave empty for whole program)
workers = "1"          # thread pool & batch size: integer or "max", "max-1", "max-2", ...
batch_pause_seconds = 15   # seconds to wait between batches; 0 disables the pause

# Optional stdin to pass to the compiled C executable while Callgrind runs
input_cmd = ""

# Progress / logging controls
progress = "plain"         # plain|auto|none — "auto" uses tqdm when available
show_stages = true         # emit per-file stage details (compile / Callgrind / pipeline)

# Per-metric toggles. Set to false to skip collecting that metric.
# "ir_offset" depends on both cyclomatic and ir_instructions; they will be
# forced on automatically when the offset is requested.
[metrics]
cyclomatic = true
ir_instructions = true
ir_offset = true
num_qubits = true
num_gates = true
num_cx = true
num_measure = true
num_u1 = true
num_u2 = true
num_u3 = true
depth = true
user_time_s = true
sys_time_s = true
cpu_time_s = true
max_rss_kb = true
