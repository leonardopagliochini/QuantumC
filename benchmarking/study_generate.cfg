# Study generation config (TOML).
# This file is read by benchmarking/study_generate.py.

# Name of the study. A folder with this name is created under benchmarking/
# containing <study>_dataset, <study>_results, <study>_plots.
study = "ir_sweep"

# Cyclomatic complexity targets (positive integers, strictly increasing). We
# keep the CC fixed to 1 for this sweep.
cc_values = [1]

# Ir offsets relative to the baseline measured for CC=1. We sweep 30 points
# from 0 to 2900 with a step of 100 to capture the growth trend.
ir_values = [
  0, 100, 200, 300, 400, 500, 600, 700, 800, 900,
 1000, 1100, 1200, 1300, 1400, 1500, 1600, 1700, 1800, 1900,
 2000, 2100, 2200, 2300, 2400, 2500, 2600, 2700, 2800, 2900,
]
