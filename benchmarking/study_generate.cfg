# Study generation config (TOML).
# This file is read by benchmarking/study_generate.py.

# Name of the study. A folder with this name is created under benchmarking/
# containing <study>_dataset, <study>_results, <study>_plots.
study = "try0"

# Cyclomatic complexity targets (positive integers, strictly increasing). Each
# value controls how many top-level if-statements the generator emits so the
# Lizard CC matches exactly. Provide one or more entries in ascending order.
cc_values = [1]

# Ir offsets relative to the baseline measured for each CC (must be strictly
# increasing). The baseline is the dynamic instruction count Callgrind reports
# for the probe program with pre_steps = 0. After calibration the script tries
# to hit baseline + offset for every entry, so the same offsets work across
# machines provided they align with the measured slope (instruction increase per
# straight-line repetition). Values must be >= 0 and are expressed in raw
# Callgrind instruction units.
ir_values = [0, 100, 200, 300]
