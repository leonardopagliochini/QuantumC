[[heatmaps]]
name = "num_qubits_heatmap"
outfile = "num_qubits_heatmap.pdf"
x = "cyclomatic"
y = "ir_offset"
value = "num_qubits"
agg = "mean"
xlabel = "Cyclomatic complexity"
ylabel = "IR offset"
title = "Average qubits vs CC and IR offset"
# palette = "viridis"
log_x = false
log_y = false
log_value = true
annotate = false
y_tick_round = 50


