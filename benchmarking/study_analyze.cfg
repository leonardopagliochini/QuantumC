[general]
palette = "viridis"

[[plots]]
name = "cc_ir_normprod_cpu"
outfile = "cc_ir_normprod_cpu.pdf"
x = { type = "normalized_product", columns = ["cyclomatic", "ir_offset"], mode = "diagonal", normalize = "max", label = "Normalized CC*IR (diagonal)" }
ys = ["cpu_time_s"]
style = "scatter"
title = "CPU time vs normalized CC*IR diagonal"
xlabel = "Normalized CC*IR (diagonal)"
ylabel = "CPU time (s)"
legend = false
log_x = false
log_y = false
fit = true
fit_outfile = "cc_ir_normprod_cpu_fit.pdf"
fit_summary_csv = "cc_ir_normprod_cpu_fit_summary.csv"
fit_models = ["linear", "exp"]

