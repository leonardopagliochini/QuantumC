# Study analysis configuration (TOML).
#
# Files are consumed by benchmarking/study_analyze.py. All outputs are written
# as PDF files into benchmarking/<study>/<study>_plots/.
#
# Available columns in <study>_metrics.csv (depending on benchmark settings):
#   cyclomatic, ir_instructions, ir_offset, num_qubits, num_gates,
#   num_cx, num_measure, num_u1, num_u2, num_u3, depth, user_time_s,
#   sys_time_s, max_rss_kb
#
# ----------------------------------------------------------------------
# Reference & Templates
# ----------------------------------------------------------------------
# [general]
# palette = "viridis"        # default matplotlib palette for all plots unless overridden
#
# [[plots]]
# # Scatter/line plot template ------------------------------------------
# name = "example_plot"                 # unique identifier for logs/debugging
# outfile = "example_plot.pdf"          # saved under benchmarking/<study>/<study>_plots/
# x = "ir_instructions"                 # column used for the x-axis
# ys = ["num_gates"]                    # one or more columns for the y-axis
# style = "scatter"                     # "scatter" or "line"
# title = "Optional title"
# xlabel = "Optional X label"
# ylabel = "Optional Y label"
# legend = true
# log_x = false
# log_y = false
# fit = true                            # also emit a best-fit curve figure
# fit_outfile = "example_plot_fit.pdf"
# fit_summary_csv = "example_plot_fit_summary.csv"
# fit_models = ["linear", "quadratic", "cubic", "exp", "exp2", "exp3"]
#
# [[heatmaps]]
# # Heatmap template -----------------------------------------------------
# name = "example_heatmap"
# outfile = "example_heatmap.pdf"
# x = "cyclomatic"
# y = "ir_instructions"
# value = "num_gates"                  # optional; defaults to counts when omitted
# agg = "mean"                          # one of: count | mean | sum | max | min
# x_bins = 10                           # or use x_bin_width for explicit bin size
# y_bins = 10
# xlabel = "Cyclomatic"
# ylabel = "IR Instructions"
# title = "Heatmap Title"
# palette = "magma"
# log_x = false
# log_y = false
# log_value = false
# annotate = false
#
# ----------------------------------------------------------------------
# Active Configuration
# ----------------------------------------------------------------------

[general]
palette = "viridis"

[[plots]]
name = "try0_IR_qubits"
outfile = "try0_ir_qubits_scatter.pdf"
x = "ir_offset"
ys = ["num_qubits"]
style = "scatter"
title = "Qubit Number vs IR"
xlabel = "IR Instructions"
ylabel = "Qubit Number"
legend = true
log_x = false
log_y = false
fit = true
fit_outfile = "try0_ir_qubits_fit.pdf"
fit_summary_csv = "cc_ir_qubits_scatter_fit_summary.csv"
fit_models = ["linear", "quadratic", "cubic", "exp", "exp2", "exp3"]

[[plots]]
name = "try0_IR_gates"
outfile = "try0_ir_gates_scatter.pdf"
x = "ir_offset"
ys = ["num_gates"]
style = "scatter"
title = "Gate Number vs IR"
xlabel = "IR Instructions"
ylabel = "Gate Number"
legend = true
log_x = false
log_y = false
fit = true
fit_outfile = "try0_ir_gates_fit.pdf"
fit_summary_csv = "cc_ir_gates_scatter_fit_summary.csv"
fit_models = ["linear", "quadratic", "cubic", "exp", "exp2", "exp3"]

[[plots]]
name = "try0_IR_depth"
outfile = "try0_ir_depth_scatter.pdf"
x = "ir_instructions"
ys = ["depth"]
style = "scatter"
title = "Circuit Depth vs IR"
xlabel = "IR Instructions"
ylabel = "Circuit Depth"
legend = true
log_x = false
log_y = false
fit = true
fit_outfile = "try0_ir_depth_fit.pdf"
fit_summary_csv = "cc_ir_depth_scatter_fit_summary.csv"
fit_models = ["linear", "quadratic", "cubic", "exp", "exp2", "exp3"]
