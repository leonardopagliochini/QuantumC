outfile = "num_qubits_surface.pdf"
interactive_outfile = "num_qubits_surface_interactive.html"
paraview_outfile = "num_qubits_surface.vtk"
paraview_scale = 0.001
x_tick_round = 1
y_tick_round = 50
x = "cyclomatic"
y = "ir_offset"
value = "num_qubits"
agg = "mean"
xlabel = "Cyclomatic complexity"
ylabel = "IR offset"
zlabel = "Average qubits"
title = "Average qubits vs CC and IR offset (surface)"
log_value = true
# z_min = 0.0
# z_max = 1e7
# color_max = 1e7
view_elev = 35.0
view_azim = -135.0

